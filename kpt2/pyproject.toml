[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kpt2-multisignal-intelligence"
version = "2.0.0"
description = "Multi-signal Kitchen Prep Time (KPT) prediction system with bias correction, kitchen load estimation, graph-based workflow resolution, composite readiness scoring, and shadow monitoring."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
